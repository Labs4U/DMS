# =============================================================================
# Electrify! Plus — Amazon Bedrock AgentCore Deployment Configuration
# =============================================================================
# Deploy with:
#   bedrock-agentcore deploy
#
# Prerequisites:
#   1. Replace both PLACEHOLDER Lambda ARNs below with the actual ARNs after
#      deploying Labs/mcp_dataviz/server.py and the Electrify DynamoDB MCP
#      server as Lambda functions.
#   2. Replace YOUR_AWS_ACCOUNT_ID with your 12-digit AWS account number.
#   3. Ensure the deploying IAM principal has bedrock:* and iam:PassRole rights.
# =============================================================================

project: electrify-plus-swarm

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  language: python
  version: "3.12"

# ── Supervisor Agent entrypoint ───────────────────────────────────────────────
# Points to the BedrockAgentCoreApp instance `app` inside app_core.py.
# The module path uses dots for directories and a colon to separate the
# variable name from the module.
entrypoint: Labs/swarm_supervisor/app_core:app

# ── Execution environment ─────────────────────────────────────────────────────
execution:
  # Requirements file relative to the project root
  requirements: Labs/swarm_supervisor/requirements.txt

  # Environment variables injected into the AgentCore runtime at execution time.
  # Sensitive values (API keys, secrets) should use AWS Secrets Manager ARNs
  # via the `secrets` block instead of plain-text `env` entries.
  env:
    AWS_REGION: us-east-1
    BEDROCK_MODEL_ID: us.anthropic.claude-3-5-sonnet-20241022-v2:0
    # Set these to the AgentCore Gateway URLs after the gateway is deployed.
    # The `gateway` block below defines the two MCP targets; the CLI will
    # resolve their invoke URLs and can inject them here automatically if
    # the target names match the env var conventions.
    ELECTRIFY_MCP_URL: PLACEHOLDER_SET_AFTER_GATEWAY_DEPLOY
    DATAVIZ_MCP_URL: PLACEHOLDER_SET_AFTER_GATEWAY_DEPLOY

# ── AgentCore Gateway — MCP tool targets ──────────────────────────────────────
# Each target wraps a Lambda function that implements an MCP server.
# The AgentCore Gateway exposes them as HTTP/SSE endpoints that the
# Supervisor Agent connects to via MCPClient.
gateway:
  targets:
    - name: electrify-dynamo-server
      type: mcp
      description: >
        Fetches ConsumptionRecord items from DynamoDB for a given customer_id
        using the listByCustomerAndMonth GSI query. Returns raw JSON for the
        Supervisor Agent to reason over or pass to the DataViz server.
      lambda:
        # Replace with the actual ARN after deploying the Electrify MCP Lambda.
        arn: arn:aws:lambda:us-east-1:YOUR_AWS_ACCOUNT_ID:function:electrify-dynamo-mcp-server

    - name: dataviz-formatting-server
      type: mcp
      description: >
        Transforms raw DynamoDB JSON payloads into Recharts-compatible data
        structures. Exposes format_bar_chart and summarise_usage tools.
        Source: Labs/mcp_dataviz/server.py
      lambda:
        # Replace with the actual ARN after deploying Labs/mcp_dataviz/server.py
        # as a Lambda function.
        arn: arn:aws:lambda:us-east-1:YOUR_AWS_ACCOUNT_ID:function:dataviz-formatting-mcp-server

# ── IAM permissions ───────────────────────────────────────────────────────────
# These permissions are attached to the execution role that AgentCore creates
# for the Supervisor Agent runtime. The CLI uses this block to generate and
# attach an inline policy to the role at deploy time.
permissions:
  - sid: InvokeBedrockModels
    effect: Allow
    actions:
      - bedrock:InvokeModel
      - bedrock:InvokeModelWithResponseStream
    resources:
      # Claude 3.5 Sonnet cross-region inference profile
      - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
      - arn:aws:bedrock:us-east-1:YOUR_AWS_ACCOUNT_ID:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0

  - sid: InvokeAgentCoreGateway
    effect: Allow
    actions:
      - bedrock-agentcore:InvokeAgentRuntime
    resources:
      # Scope to this project's gateway; tighten to the specific gateway ARN
      # once it is provisioned by the deploy step.
      - arn:aws:bedrock-agentcore:us-east-1:YOUR_AWS_ACCOUNT_ID:agent-runtime/*

  - sid: InvokeMCPLambdaFunctions
    effect: Allow
    actions:
      - lambda:InvokeFunction
    resources:
      # Electrify DynamoDB MCP server
      - arn:aws:lambda:us-east-1:YOUR_AWS_ACCOUNT_ID:function:electrify-dynamo-mcp-server
      # DataViz formatting MCP server
      - arn:aws:lambda:us-east-1:YOUR_AWS_ACCOUNT_ID:function:dataviz-formatting-mcp-server

  - sid: QueryConsumptionRecordTable
    effect: Allow
    actions:
      - dynamodb:Query
      - dynamodb:GetItem
    resources:
      # Primary table (Amplify Gen 2 sandbox-deployed name)
      - arn:aws:dynamodb:us-east-1:YOUR_AWS_ACCOUNT_ID:table/ConsumptionRecord-o6wktlvbrvgydojj56vajcbiwy-NONE
      # GSI: customerId-monthYear index used by listByCustomerAndMonth
      - arn:aws:dynamodb:us-east-1:YOUR_AWS_ACCOUNT_ID:table/ConsumptionRecord-o6wktlvbrvgydojj56vajcbiwy-NONE/index/*
